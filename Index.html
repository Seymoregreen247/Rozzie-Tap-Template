<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RozzieTap Smart Page</title>

<!-- ============================================================
  ROZZIETAP MASTER TEMPLATE
  A Seymore Green company

  HOW TO USE THIS FILE FOR A NEW CLIENT:
  1. Duplicate this file.
  2. Edit ONLY the CONFIG block below (between the CONFIG START
     and CONFIG END comments). Do not touch anything past that
     unless you're changing the design for every future client.
  3. Save, push to GitHub, deploy as its own Netlify site.
  4. Point that client's dynamic QR code / NFC card at the new
     Netlify URL.

  This one file works for a barber, a plumber, a restaurant, a
  real estate agent -- whatever. The CONFIG block controls every
  word, label, photo, and link on the page.
============================================================ -->

<style>
  :root{
    --accent: #4BBB2A;
    --dark: #1e1e1e;
    --dark2: #141414;
    --card: #232323;
    --card2: #1a1a1a;
    --text-dim: #b6b6b6;
    --text-dim2: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--dark);
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    text-align: center;
    padding: 34px 20px 26px;
    background: linear-gradient(160deg, var(--dark) 0%, #202b1c 100%);
    border-bottom: 3px solid var(--accent);
  }
  .hero .eyebrow {
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .hero .logo-circle {
    width: 84px; height: 84px;
    border-radius: 50%;
    margin: 0 auto 14px;
    background: var(--card2);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: var(--accent);
    overflow: hidden;
  }
  .hero .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .hero h1 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1.15;
  }
  .hero .tagline {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .hero .meta-row {
    margin-top: 14px;
    display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-dim2);
  }
  .hero .meta-row span { display: inline-flex; align-items: center; gap: 5px; }
  .hero .badge {
    display: inline-block;
    margin-top: 14px;
    background: var(--accent);
    color: var(--dark);
    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: 0.3px;
    padding: 6px 14px;
    border-radius: 30px;
  }

  /* ---------- CTA BAR (sticky-feel, top actions) ---------- */
  .cta-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: var(--dark2);
  }
  .cta-btn {
    flex: 1;
    text-align: center;
    padding: 13px 10px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 13.5px;
    letter-spacing: 0.2px;
  }
  .cta-btn.primary { background: var(--accent); color: var(--dark); }
  .cta-btn.secondary { background: transparent; border: 1.5px solid #3a3a3a; color: #fff; }

  /* ---------- SECTION SHELL ---------- */
  .section { padding: 26px 20px; }
  .section-title {
    font-size: 11.5px;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* ---------- GALLERY ---------- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .gallery img, .gallery .ph {
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    background: var(--card2);
  }
  .gallery .ph {
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #555; text-align: center; padding: 4px;
  }

  /* ---------- REVIEWS ---------- */
  .review-card {
    background: var(--card);
    border: 1px solid #303030;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .review-stars { color: var(--accent); font-size: 13px; margin-bottom: 6px; letter-spacing: 2px; }
  .review-quote { font-size: 13.5px; color: #e5e5e5; line-height: 1.5; font-style: italic; }
  .review-name { margin-top: 8px; font-size: 11.5px; color: var(--text-dim2); font-weight: 700; }
  .review-link {
    display: block; text-align: center; margin-top: 12px;
    font-size: 12.5px; color: var(--accent); font-weight: 700;
    border: 1.5px solid var(--accent); border-radius: 10px; padding: 11px;
  }

  /* ---------- SERVICES / MENU / LISTINGS (label flexes per trade) ---------- */
  .svc-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .svc-row:last-child { border-bottom: none; }
  .svc-name { font-size: 14px; font-weight: 700; }
  .svc-desc { font-size: 11.5px; color: var(--text-dim2); margin-top: 2px; }
  .svc-price { font-size: 14px; font-weight: 800; color: var(--accent); white-space: nowrap; padding-left: 12px; }

  /* ---------- HOURS ---------- */
  .hours-row {
    display: flex; justify-content: space-between;
    font-size: 13px; padding: 7px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .hours-row:last-child { border-bottom: none; }
  .hours-row .day { color: #ddd; font-weight: 600; }
  .hours-row .time { color: var(--text-dim); }
  .hours-row.today .day, .hours-row.today .time { color: var(--accent); font-weight: 800; }

  /* ---------- SOCIALS ---------- */
  .social-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .social-pill {
    flex: 1; min-width: 90px; text-align: center;
    background: var(--card); border: 1px solid #303030;
    border-radius: 10px; padding: 11px 8px;
    font-size: 12.5px; font-weight: 700;
  }

  /* ---------- MAP / ADDRESS ---------- */
  .addr-card {
    background: var(--card); border: 1px solid #303030;
    border-radius: 12px; padding: 16px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .addr-text { font-size: 13px; color: #ddd; line-height: 1.5; }
  .addr-go {
    background: var(--accent); color: var(--dark);
    font-weight: 800; font-size: 12px;
    padding: 10px 14px; border-radius: 8px; white-space: nowrap;
  }

  /* ---------- FOOTER ---------- */
  .footer {
    background: var(--accent);
    color: var(--dark);
    text-align: center;
    padding: 22px 20px 26px;
  }
  .footer .fname { font-size: 15px; font-weight: 800; }
  .footer .fby { font-size: 10.5px; margin-top: 10px; opacity: 0.75; font-weight: 700; letter-spacing: 0.5px; }
</style>
</head>
<body>

<!-- =======================================================
     CONFIG START -- edit everything in this block only
     ======================================================= -->
<script>
const CONFIG = {
  // ----- BASIC INFO -----
  businessName: "Felix Barber Shop",
  tagline: "Clean fades. No waiting around. Rozzie's own since day one.",
  logoInitial: "F",          // used if no logo photo
  logoPhotoUrl: "",          // optional: URL to a logo image, leave "" to use initial

  // ----- TOP BADGE (optional, leave "" to hide) -----
  badgeText: "TRY IT FREE 48 HOURS",

  // ----- CONTACT / ACTIONS -----
  phone: "6175551234",              // digits only, used for tap-to-call
  phoneDisplay: "(617) 555-1234",
  primaryCtaLabel: "Book Now",      // e.g. "Book Now" / "Call Now" / "Get a Quote" / "Schedule a Showing"
  primaryCtaUrl: "tel:6175551234",  // booking link, phone link, whatever fits
  secondaryCtaLabel: "Call Now",
  secondaryCtaUrl: "tel:6175551234",

  // ----- ADDRESS -----
  address: "35 Poplar St, Roslindale, MA 02131",
  mapsUrl: "https://maps.google.com/?q=35+Poplar+St+Roslindale+MA",

  // ----- GALLERY (use real photo URLs; leave array item "" for a placeholder tile) -----
  galleryTitle: "The Work",         // "The Work" / "Our Space" / "Recent Listings" / "Menu Highlights"
  gallery: [
    "", "", "",
    "", "", ""
  ],

  // ----- REVIEWS -----
  reviewsTitle: "What People Say",
  reviews: [
    { stars: 5, quote: "Best fade in Rozzie, hands down. In and out in 20 minutes.", name: "Marcus D." },
    { stars: 5, quote: "Felix has been cutting my hair for 3 years. Never disappoints.", name: "Andre P." }
  ],
  googleReviewUrl: "https://google.com/search?q=felix+barber+shop+reviews",

  // ----- SERVICES / MENU / LISTINGS (label + rows both flex per trade) -----
  servicesTitle: "Services",        // "Services" / "Menu" / "Listings"
  services: [
    { name: "Haircut", desc: "Classic or fade, your call", price: "$35" },
    { name: "Haircut + Beard", desc: "Full clean up", price: "$45" },
    { name: "Kids Cut", desc: "12 and under", price: "$25" },
    { name: "Hot Towel Shave", desc: "Straight razor finish", price: "$30" }
  ],

  // ----- HOURS -----
  hoursTitle: "Hours",
  todayIndex: 0,   // 0=Sun .. 6=Sat -- set dynamically if you wire up JS date logic, or hardcode for a static build
  hours: [
    { day: "Sunday", time: "Closed" },
    { day: "Monday", time: "10:00 AM - 7:00 PM" },
    { day: "Tuesday", time: "10:00 AM - 7:00 PM" },
    { day: "Wednesday", time: "10:00 AM - 7:00 PM" },
    { day: "Thursday", time: "10:00 AM - 8:00 PM" },
    { day: "Friday", time: "9:00 AM - 8:00 PM" },
    { day: "Saturday", time: "9:00 AM - 6:00 PM" }
  ],

  // ----- SOCIALS -----
  socials: [
    { label: "Instagram", url: "https://instagram.com/felixbarbershop" },
    { label: "Facebook", url: "https://facebook.com/felixbarbershop" }
  ],

  // ----- BRAND ACCENT (optional per-client color override) -----
  accentColor: "#4BBB2A"
};
</script>
<!-- =======================================================
     CONFIG END -- do not edit below this line
     ======================================================= -->

<div class="wrap" id="page">

  <!-- HERO -->
  <div class="hero">
    <div class="eyebrow">POWERED BY ROZZIETAP</div>
    <div class="logo-circle" id="logoCircle"></div>
    <h1 id="bizName"></h1>
    <div class="tagline" id="bizTagline"></div>
    <div class="badge" id="bizBadge" style="display:none;"></div>
  </div>

  <!-- CTA BAR -->
  <div class="cta-bar">
    <a class="cta-btn primary" id="ctaPrimary" href="#"></a>
    <a class="cta-btn secondary" id="ctaSecondary" href="#"></a>
  </div>

  <!-- GALLERY -->
  <div class="section">
    <div class="section-title" id="galleryTitle"></div>
    <div class="gallery" id="galleryGrid"></div>
  </div>

  <!-- REVIEWS -->
  <div class="section">
    <div class="section-title" id="reviewsTitle"></div>
    <div id="reviewList"></div>
    <a class="review-link" id="reviewLink" href="#">See All Reviews on Google</a>
  </div>

  <!-- SERVICES -->
  <div class="section">
    <div class="section-title" id="servicesTitle"></div>
    <div id="servicesList"></div>
  </div>

  <!-- HOURS -->
  <div class="section">
    <div class="section-title" id="hoursTitle"></div>
    <div id="hoursList"></div>
  </div>

  <!-- SOCIALS -->
  <div class="section">
    <div class="section-title">Follow Along</div>
    <div class="social-row" id="socialRow"></div>
  </div>

  <!-- ADDRESS -->
  <div class="section">
    <div class="section-title">Find Us</div>
    <div class="addr-card">
      <div class="addr-text" id="addrText"></div>
      <a class="addr-go" id="addrGo" href="#">Directions</a>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="fname" id="footerName"></div>
    <div class="fby">A SEYMORE GREEN COMPANY &middot; ROZZIETAP</div>
  </div>

</div>

<script>
(function(){
  const c = CONFIG;
  document.documentElement.style.setProperty('--accent', c.accentColor || '#4BBB2A');

  // Hero
  document.getElementById('bizName').textContent = c.businessName;
  document.getElementById('bizTagline').textContent = c.tagline;
  const logo = document.getElementById('logoCircle');
  if (c.logoPhotoUrl) {
    logo.innerHTML = '<img src="' + c.logoPhotoUrl + '" alt="' + c.businessName + '">';
  } else {
    logo.textContent = c.logoInitial || c.businessName.charAt(0);
  }
  if (c.badgeText) {
    const b = document.getElementById('bizBadge');
    b.textContent = c.badgeText;
    b.style.display = 'inline-block';
  }

  // CTA bar
  const p = document.getElementById('ctaPrimary');
  p.textContent = c.primaryCtaLabel; p.href = c.primaryCtaUrl;
  const s = document.getElementById('ctaSecondary');
  s.textContent = c.secondaryCtaLabel; s.href = c.secondaryCtaUrl;

  // Gallery
  document.getElementById('galleryTitle').textContent = c.galleryTitle;
  const grid = document.getElementById('galleryGrid');
  c.gallery.forEach(function(url){
    if (url) {
      const img = document.createElement('img');
      img.src = url; img.alt = c.businessName;
      grid.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = 'Photo';
      grid.appendChild(ph);
    }
  });

  // Reviews
  document.getElementById('reviewsTitle').textContent = c.reviewsTitle;
  const rl = document.getElementById('reviewList');
  c.reviews.forEach(function(r){
    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML =
      '<div class="review-stars">' + '&#9733;'.repeat(r.stars) + '</div>' +
      '<div class="review-quote">&ldquo;' + r.quote + '&rdquo;</div>' +
      '<div class="review-name">&mdash; ' + r.name + '</div>';
    rl.appendChild(card);
  });
  document.getElementById('reviewLink').href = c.googleReviewUrl;

  // Services
  document.getElementById('servicesTitle').textContent = c.servicesTitle;
  const sl = document.getElementById('servicesList');
  c.services.forEach(function(item){
    const row = document.createElement('div');
    row.className = 'svc-row';
    row.innerHTML =
      '<div><div class="svc-name">' + item.name + '</div>' +
      '<div class="svc-desc">' + (item.desc || '') + '</div></div>' +
      '<div class="svc-price">' + (item.price || '') + '</div>';
    sl.appendChild(row);
  });

  // Hours
  document.getElementById('hoursTitle').textContent = c.hoursTitle;
  const hl = document.getElementById('hoursList');
  c.hours.forEach(function(h, i){
    const row = document.createElement('div');
    row.className = 'hours-row' + (i === c.todayIndex ? ' today' : '');
    row.innerHTML = '<div class="day">' + h.day + '</div><div class="time">' + h.time + '</div>';
    hl.appendChild(row);
  });

  // Socials
  const sr = document.getElementById('socialRow');
  c.socials.forEach(function(soc){
    const a = document.createElement('a');
    a.className = 'social-pill';
    a.href = soc.url;
    a.textContent = soc.label;
    sr.appendChild(a);
  });

  // Address
  document.getElementById('addrText').textContent = c.address;
  document.getElementById('addrGo').href = c.mapsUrl;

  // Footer
  document.getElementById('footerName').textContent = c.businessName;

  // Page title
  document.title = c.businessName + ' | RozzieTap';
})();
</script>

</body>
</html>
